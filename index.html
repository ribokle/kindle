<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600, initial-scale=1.0">
  <meta http-equiv="refresh" content="600">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="top-bar">
    <div id="clock-date">
      <span id="time-display"></span>
      <span id="date-display"></span>
    </div>
    <div id="weather-widget">
      <span id="weather-place"></span>
      <span id="weather-icon"></span>
      <span id="weather-temp"></span>
      <span id="weather-desc"></span>
    </div>
  </header>

  <nav id="tab-bar">
    <button class="tab-btn active" onclick="switchTab('today')">TODAY</button>
    <button class="tab-btn" onclick="switchTab('week')">WEEK</button>
    <button class="tab-btn" onclick="switchTab('month')">MONTH</button>
    <button class="tab-btn" onclick="switchTab('tasks')">TASKS</button>
  </nav>

  <!-- TODAY VIEW -->

  <div id="view-today" class="view active">
    <div class="view-inner">
      <div class="section">
        <div class="section-label">EVENTS TODAY</div>
        <div id="today-events"></div>
      </div>
      <div class="divider"></div>
      <div class="section">
        <div class="section-label">TASKS TODAY</div>
        <div id="today-tasks"></div>
      </div>
    </div>
  </div>

  <!-- WEEK VIEW -->

  <div id="view-week" class="view">
    <div id="week-grid"></div>
  </div>

  <!-- MONTH VIEW -->

  <div id="view-month" class="view">
    <div id="month-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">&#8592; PREV</button>
      <div id="month-header"></div>
      <button class="nav-btn" onclick="changeMonth(1)">NEXT &#8594;</button>
    </div>
    <div id="month-day-labels"></div>
    <div id="month-grid"></div>
  </div>

  <!-- TASKS VIEW -->

  <div id="view-tasks" class="view">
    <div class="view-inner">
      <div class="tasks-header-row">
        <div class="section-label">ALL TASKS</div>
        <button id="clear-done-btn" onclick="clearDoneTasks()">CLEAR DONE</button>
      </div>
      <div id="filter-bar">
        <button class="filter-btn active" onclick="setFilter('all')">ALL</button>
        <button class="filter-btn" onclick="setFilter('pending')">PENDING</button>
        <button class="filter-btn" onclick="setFilter('done')">DONE</button>
      </div>
      <div id="all-tasks-list"></div>
    </div>
  </div>

  <script src="app.js"></script>

</body>
</html>
